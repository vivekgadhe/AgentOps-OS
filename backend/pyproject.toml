
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-os"
version = "0.1.0"
description = "AI agent execution platform with persistent, verifiable workflows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "openai>=3.39.0,<4.0.0",
    "pgvector>=0.3.6",
    "pypdf>=5.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs a running PostgreSQL (make up)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

